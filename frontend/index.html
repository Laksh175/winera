  <!-- Google tag (gtag.js) - loaded on first user interaction or idle to avoid blocking initial render -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    (function() {
      var loaded = false;
      function loadGtag() {
        if (loaded) return;
        loaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-J2L2TDBSJS';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'G-J2L2TDBSJS');
      }
      ['scroll', 'touchstart', 'mousemove', 'click', 'keydown'].forEach(function(evt) {
        window.addEventListener(evt, loadGtag, { once: true, passive: true });
      });
      function loadSecondaryFonts() {
        var f = document.createElement('link');
        f.rel = 'stylesheet';
        f.href = 'https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Urbanist:wght@500;600;700&display=swap';
        document.head.appendChild(f);
      }
      if ('requestIdleCallback' in window) {
        requestIdleCallback(function() {
          setTimeout(loadGtag, 3500);
          setTimeout(loadSecondaryFonts, 1800);
        });
      } else {
        setTimeout(loadGtag, 4500);
        setTimeout(loadSecondaryFonts, 2500);
      }
    })();
  </script>
