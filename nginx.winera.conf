gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/vnd.ms-fontobject
    font/ttf
    font/otf
    font/woff
    font/woff2
    image/svg+xml
    image/x-icon;

server {
    listen 80;
    listen [::]:80;
    server_name winera.in www.winera.in;

    # Redirect all HTTP requests to HTTPS with 301 Permanent Redirect
    return 301 https://winera.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.winera.in;

    # SSL Certificate Paths (Adjust to your Certbot/Let's Encrypt path)
    ssl_certificate /etc/letsencrypt/live/winera.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/winera.in/privkey.pem;

    # Redirect www to non-www
    return 301 https://winera.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name winera.in;

    # Document Root (Path where frontend/dist is located on your server)
    root /var/www/winera/frontend/dist;
    index index.html;

    # SSL Certificate Paths (Adjust to your Certbot/Let's Encrypt path)
    ssl_certificate /etc/letsencrypt/live/winera.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/winera.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ==========================================================================
    # SECURITY HEADERS (Brings Lighthouse 'Best Practices' to 95-100)
    # ==========================================================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==========================================================================
    # BROWSER CACHE OPTIMIZATION (Resolves "Use efficient cache lifetimes" audit)
    # ==========================================================================
    # 1 Year Immutable Cache for hashed assets (JS, CSS, Images, Fonts)
    location ~* \.(?:css|js|webp|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # HTML files should not be cached so new updates appear instantly
    location ~* \.(?:html|htm)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # ==========================================================================
    # BACKEND API PROXY
    # ==========================================================================
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend Uploads Static Files
    location /uploads/ {
        proxy_pass http://127.0.0.1:5001/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ==========================================================================
    # SPA ROUTING (React Router fallback)
    # ==========================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }
}
