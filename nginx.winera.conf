server {
    listen 80;
    listen [::]:80;
    server_name winera.in www.winera.in;

    # Redirect all HTTP requests to HTTPS with 301 Permanent Redirect
    return 301 https://winera.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.winera.in;

    # SSL Certificate Paths (Adjust to your Certbot/Let's Encrypt path)
    ssl_certificate /etc/letsencrypt/live/winera.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/winera.in/privkey.pem;

    # Redirect www to non-www
    return 301 https://winera.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name winera.in;

    # Document Root (Path where frontend/dist is located on your server)
    root /var/www/winera/frontend/dist;
    index index.html;

    # SSL Certificate Paths (Adjust to your Certbot/Let's Encrypt path)
    ssl_certificate /etc/letsencrypt/live/winera.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/winera.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ==========================================================================
    # SECURITY HEADERS (Brings Lighthouse 'Best Practices' to 95-100)
    # ==========================================================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==========================================================================
    # BROWSER CACHE OPTIMIZATION (Resolves "Use efficient cache lifetimes" audit)
    # ==========================================================================
    # 1 Year Immutable Cache for hashed assets (JS, CSS, Images, Fonts)
    location ~* \.(?:css|js|webp|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # PDF Brochures - no stale caching so uploaded/updated catalogues reflect immediately
    location ~* \.pdf$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # HTML files should not be cached so new updates appear instantly
    location ~* \.(?:html|htm)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # ==========================================================================
    # BACKEND API PROXY
    # ==========================================================================
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend Uploads Static Files
    location /uploads/ {
        proxy_pass http://127.0.0.1:5001/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Dynamic Sitemaps (Proxy directly to Node backend so new blogs/products reflect in real-time)
    location ~* ^/(sitemap|page-sitemap|product-sitemap|project-sitemap|blog-sitemap)\.xml$ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Type "application/xml; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ==========================================================================
    # 301 REDIRECTS & 410 GONE FOR SEO CANONICAL PRESERVATION (Soft 404 Resolution)
    # ==========================================================================
    # 410 Gone for discontinued services page
    location = /services {
        return 410;
    }
    location = /services/ {
        return 410;
    }

    # Static 301 Redirects
    location = /home {
        return 301 https://winera.in/;
    }
    location = /home/ {
        return 301 https://winera.in/;
    }
    location = /contact-us {
        return 301 https://winera.in/contact;
    }
    location = /contact-us/ {
        return 301 https://winera.in/contact;
    }
    location = /auth/privacy-policy {
        return 301 https://winera.in/privacy-policy;
    }
    location = /auth/privacy-policy/ {
        return 301 https://winera.in/privacy-policy;
    }
    location = /roi {
        return 301 https://winera.in/resource/roi;
    }
    location = /roi/ {
        return 301 https://winera.in/resource/roi;
    }
    location = /safety-standards {
        return 301 https://winera.in/resource/safety-standards;
    }
    location = /safety-standards/ {
        return 301 https://winera.in/resource/safety-standards;
    }
    location = /faq {
        return 301 https://winera.in/;
    }
    location = /faq/ {
        return 301 https://winera.in/;
    }
    location = /arcade-game {
        return 301 https://winera.in/product/arcade-games;
    }
    location = /arcade-game/ {
        return 301 https://winera.in/product/arcade-games;
    }

    # Blog URL Normalization & Legacy Redirects
    location ~* ^/blog/bowling-alley-setup-cost-in-india-price-per-lane-roi/?$ {
        return 301 https://winera.in/blog/bowling-alley-setup-cost-in-india-price-per-lane;
    }
    location ~* ^/blog/how-to-start-a-game-zone-in-surat-complete-guide-for-business-owners/?$ {
        return 301 https://winera.in/blog/how-to-start-a-game-zone-in-surat;
    }
    location ~* ^/blog/how-much-does-an-indoor-playground-cost-in-india-a-2026-guide-for-investors/?$ {
        return 301 https://winera.in/blog/indoor-playground-cost-in-india-a-guide-for-investors;
    }
    location ~* ^/blog/choosing-a-game-zone-developer-in-india-10-point-checklist/?$ {
        return 301 https://winera.in/blog/how-to-choose-game-zone-developer-india;
    }

    # Discontinued / Repurposed Categories Redirect to Home
    location = /products/sculpture {
        return 301 https://winera.in/;
    }
    location = /products/sculpture/ {
        return 301 https://winera.in/;
    }
    location = /products/reception-table {
        return 301 https://winera.in/;
    }
    location = /products/reception-table/ {
        return 301 https://winera.in/;
    }
    location = /products/lights {
        return 301 https://winera.in/;
    }
    location = /products/lights/ {
        return 301 https://winera.in/;
    }

    # Plural bumper-cars to singular bumper-car
    location = /products/bumper-cars {
        return 301 https://winera.in/product/bumper-car;
    }
    location = /products/bumper-cars/ {
        return 301 https://winera.in/product/bumper-car;
    }

    # Generic Plural /products/<slug> to Singular /product/<slug>
    location ~* ^/products/([^/]+)/?$ {
        return 301 https://winera.in/product/$1$is_args$args;
    }

    # Redirect /product/<category>/<slug> to /product/<slug> with HTTP 301
    # Examples:
    # /product/arcade-games/super-ball-2-arcade-game -> /product/super-ball-2-arcade-game
    # /product/arcade-games/wheel-catcher -> /product/wheel-catcher
    # /product/arcade-games/noahs-ark-8-players -> /product/noahs-ark-8-players
    # /product/vr-games/vr-flying-ride -> /product/vr-flying-ride
    location ~* ^/product/[^/]+/([^/]+)/?$ {
        return 301 https://winera.in/product/$1$is_args$args;
    }

    # ==========================================================================
    # SPA ROUTING & DYNAMIC SERVER-SIDE SEO TAG INJECTION
    # Proxies dynamic page requests to Node.js backend so Googlebot, WhatsApp,
    # Facebook, LinkedIn, Twitter crawlers receive dynamically injected title,
    # description, image, and structured JSON-LD schema instead of generic homepage tags.
    # ==========================================================================
    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
